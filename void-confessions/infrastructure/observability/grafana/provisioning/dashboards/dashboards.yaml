# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Void Confessions Dashboards'
    orgId: 1
    folder: 'Void Confessions'
    folderUid: 'void-confessions'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
