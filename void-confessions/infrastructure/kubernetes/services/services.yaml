# Void Confessions - Kubernetes Services
---
# API Gateway Service (LoadBalancer - external traffic)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
  annotations:
    # AWS ALB annotations (if using AWS)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # GCP annotations (if using GCP)
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 3000
      protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Local
---
# Confession Service (ClusterIP - internal only)
apiVersion: v1
kind: Service
metadata:
  name: confession-service
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: confession-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: confession-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
---
# Sentiment Service (ClusterIP - internal only)
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: sentiment-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentiment-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      protocol: TCP
---
# Redaction Service (ClusterIP - internal only)
apiVersion: v1
kind: Service
metadata:
  name: redaction-service
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: redaction-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redaction-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      protocol: TCP
---
# Web Frontend Service (ClusterIP - accessed via Ingress)
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
# Admin Dashboard Service (ClusterIP - accessed via Ingress)
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
---
# Redis Service (ClusterIP - internal only)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
# Headless service for Redis (for StatefulSet if needed later)
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
