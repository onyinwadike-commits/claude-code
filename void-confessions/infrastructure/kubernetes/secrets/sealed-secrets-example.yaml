# Sealed Secrets Example
#
# For production, use Bitnami Sealed Secrets or similar solution
# to encrypt secrets that can be safely stored in git.
#
# Installation:
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# Usage:
#   kubeseal --format yaml < secrets.yaml > sealed-secrets.yaml
#
# Example sealed secret structure:
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: database-credentials
  namespace: void-confessions
spec:
  encryptedData:
    DATABASE_URL: AgBy8hC...encrypted_base64...==
    POSTGRES_USER: AgDk2j...encrypted_base64...==
    POSTGRES_PASSWORD: AgCx9m...encrypted_base64...==
  template:
    metadata:
      name: database-credentials
      namespace: void-confessions
    type: Opaque
---
