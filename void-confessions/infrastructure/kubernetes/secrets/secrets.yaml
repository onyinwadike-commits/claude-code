# Void Confessions - Secrets Templates
# WARNING: Replace placeholder values before applying!
# In production, use external secrets management (Vault, AWS Secrets Manager, etc.)
---
# Database Credentials
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: "postgresql://void_user:CHANGE_ME_STRONG_PASSWORD@postgres:5432/void_confessions"
  POSTGRES_USER: "void_user"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  POSTGRES_DB: "void_confessions"
---
# Redis Credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Redis connection string
  # Format: redis://:password@host:port
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis:6379"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
---
# API Keys and Tokens
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # JWT signing secret (generate with: openssl rand -base64 64)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MIN_64_CHARS_RANDOM_STRING_HERE"
  # API key for internal service communication
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_API_KEY"
  # RevenueCat API key for subscriptions
  REVENUECAT_API_KEY: "CHANGE_ME_REVENUECAT_KEY"
  REVENUECAT_WEBHOOK_SECRET: "CHANGE_ME_REVENUECAT_WEBHOOK"
---
# External Service API Keys
apiVersion: v1
kind: Secret
metadata:
  name: external-api-keys
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Sentry DSN for error tracking
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/project-id"
  # OpenAI API key (for Confidant AI feature)
  OPENAI_API_KEY: "sk-CHANGE_ME_OPENAI_KEY"
  # Perspective API key (for content moderation)
  PERSPECTIVE_API_KEY: "CHANGE_ME_PERSPECTIVE_KEY"
---
# TLS Certificate (for Ingress)
# In production, use cert-manager with Let's Encrypt
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificate
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: kubernetes.io/tls
stringData:
  # Replace with actual certificate and key
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_ACTUAL_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_PRIVATE_KEY
    -----END PRIVATE KEY-----
---
# Admin Authentication Secret
apiVersion: v1
kind: Secret
metadata:
  name: admin-auth
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: void-confessions
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Admin portal authentication
  ADMIN_JWT_SECRET: "CHANGE_ME_ADMIN_JWT_SECRET_MIN_64_CHARS"
  # Initial admin credentials (change immediately after first login)
  INITIAL_ADMIN_USERNAME: "admin"
  INITIAL_ADMIN_PASSWORD: "CHANGE_ME_IMMEDIATELY"
