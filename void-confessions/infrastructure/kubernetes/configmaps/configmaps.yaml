# Void Confessions - ConfigMaps
# Non-sensitive configuration for all services
---
# API Gateway Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://voidconfessions.app,https://admin.voidconfessions.app"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  # Internal service URLs
  CONFESSION_SERVICE_URL: "http://confession-service:3001"
  SENTIMENT_SERVICE_URL: "http://sentiment-service:3002"
  REDACTION_SERVICE_URL: "http://redaction-service:3003"
---
# Confession Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: confession-service-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: confession-service
    app.kubernetes.io/component: backend
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
  # Confession settings
  CONFESSION_MAX_LENGTH: "5000"
  CONFESSION_MIN_LENGTH: "10"
  CONFESSION_TTL_HOURS: "24"
  # Moderation settings
  AUTO_MODERATION_ENABLED: "true"
  MODERATION_QUEUE_ENABLED: "true"
  CRISIS_DETECTION_ENABLED: "true"
  # Database connection pool
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_IDLE_TIMEOUT_MS: "30000"
---
# Sentiment Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentiment-service-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: sentiment-service
    app.kubernetes.io/component: backend
data:
  NODE_ENV: "production"
  PORT: "3002"
  LOG_LEVEL: "info"
  # Sentiment analysis settings
  SENTIMENT_MODEL: "default"
  BATCH_SIZE: "10"
  CACHE_TTL_SECONDS: "3600"
---
# Redaction Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redaction-service-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: redaction-service
    app.kubernetes.io/component: backend
data:
  NODE_ENV: "production"
  PORT: "3003"
  LOG_LEVEL: "info"
  # PII Redaction settings
  DEEP_SCRUB_ENABLED: "true"
  REDACTION_PATTERNS: "email,phone,ssn,credit_card,ip_address,address,url"
---
# Web App Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.voidconfessions.app"
  NEXT_PUBLIC_WS_URL: "wss://api.voidconfessions.app"
  NEXT_PUBLIC_SENTRY_DSN: ""
---
# Admin App Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.voidconfessions.app"
  NEXT_PUBLIC_ADMIN_API_URL: "https://api.voidconfessions.app/admin"
---
# Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: void-confessions
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    tcp-keepalive 300
    timeout 0
