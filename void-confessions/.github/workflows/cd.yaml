# CD Pipeline - Continuous Deployment
# Runs on merge to main branch
name: CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'

  # Allow manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_staging:
        description: 'Skip staging deployment (production only)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/void-confessions

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel deployments

jobs:
  # Run tests before deployment
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:unit
        env:
          CI: true

      - name: Type check
        run: pnpm typecheck

  # Build and push Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - name: confession-service
            context: ./services/confession-service
            dockerfile: ./services/confession-service/Dockerfile
          - name: sentiment-service
            context: ./services/sentiment-service
            dockerfile: ./services/sentiment-service/Dockerfile
          - name: redaction-service
            context: ./services/redaction-service
            dockerfile: ./services/redaction-service/Dockerfile
          - name: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - name: admin
            context: ./apps/admin
            dockerfile: ./apps/admin/Dockerfile
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # Deploy to staging environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_staging)
    environment:
      name: staging
      url: https://staging.voidconfessions.app
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Update image tags in Kustomize
        run: |
          cd infrastructure/kubernetes

          # Update all image tags to the new version
          for service in api-gateway confession-service sentiment-service redaction-service web admin; do
            kubectl kustomize edit set image \
              ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${{ github.run_number }}
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/staging

      - name: Wait for rollout
        run: |
          echo "Waiting for deployments to be ready..."

          for deployment in api-gateway confession-service sentiment-service redaction-service web admin; do
            kubectl rollout status deployment/${deployment} \
              -n void-confessions-staging \
              --timeout=300s
          done

      - name: Verify deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods -n void-confessions-staging

          echo "Checking services..."
          kubectl get services -n void-confessions-staging

  # Run smoke tests against staging
  smoke-tests-staging:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for staging to stabilize
        run: sleep 30

      - name: Run smoke tests
        run: |
          STAGING_URL="https://staging.voidconfessions.app"
          API_URL="https://staging-api.voidconfessions.app"

          echo "Testing web app health..."
          curl -f "${STAGING_URL}" || exit 1
          echo "✓ Web app is accessible"

          echo "Testing API health..."
          curl -f "${API_URL}/health" || exit 1
          echo "✓ API health check passed"

          echo "Testing API status..."
          curl -f "${API_URL}/api/v1/status" || exit 1
          echo "✓ API status endpoint passed"

          echo "Testing admin app..."
          curl -f "https://staging-admin.voidconfessions.app/login" || exit 1
          echo "✓ Admin app is accessible"

      - name: Run E2E smoke tests
        run: pnpm test:e2e:smoke
        env:
          STAGING_URL: https://staging.voidconfessions.app
          API_URL: https://staging-api.voidconfessions.app
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: staging-smoke-test-results
          path: test-results/

  # Notify about staging deployment
  notify-staging:
    name: Notify Staging Deployment
    runs-on: ubuntu-latest
    needs: smoke-tests-staging
    steps:
      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Confession Service: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Sentiment Service: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Redaction Service: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Web: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Admin: \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging App](https://staging.voidconfessions.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging API](https://staging-api.voidconfessions.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging Admin](https://staging-admin.voidconfessions.app)" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Staging deployment complete!
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            URL: https://staging.voidconfessions.app
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Manual approval gate for production
  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: smoke-tests-staging
    environment:
      name: production-approval
    steps:
      - name: Approval received
        run: |
          echo "## Production Deployment Approved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Approved by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # Deploy to production environment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    environment:
      name: production
      url: https://voidconfessions.app
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Create deployment backup
        run: |
          echo "Creating backup of current deployment..."
          kubectl get deployments -n void-confessions -o yaml > deployment-backup-$(date +%Y%m%d-%H%M%S).yaml

      - name: Update image tags
        run: |
          cd infrastructure/kubernetes

          for service in api-gateway confession-service sentiment-service redaction-service web admin; do
            kubectl kustomize edit set image \
              ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${{ github.run_number }}
          done

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/production

      - name: Wait for rollout
        run: |
          echo "Waiting for production deployments..."

          for deployment in api-gateway confession-service sentiment-service redaction-service web admin; do
            echo "Waiting for ${deployment}..."
            kubectl rollout status deployment/${deployment} \
              -n void-confessions \
              --timeout=600s
          done

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."

          echo "Pod status:"
          kubectl get pods -n void-confessions

          echo "Service status:"
          kubectl get services -n void-confessions

          echo "Ingress status:"
          kubectl get ingress -n void-confessions

  # Production smoke tests
  smoke-tests-production:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production to stabilize
        run: sleep 30

      - name: Run production smoke tests
        run: |
          PROD_URL="https://voidconfessions.app"
          API_URL="https://api.voidconfessions.app"

          echo "Testing production web app..."
          curl -f "${PROD_URL}" || exit 1
          echo "✓ Production web app is accessible"

          echo "Testing production API health..."
          curl -f "${API_URL}/health" || exit 1
          echo "✓ Production API health check passed"

          echo "Testing production API status..."
          response=$(curl -s "${API_URL}/api/v1/status")
          echo "API Status: ${response}"
          echo "✓ Production API status endpoint passed"

          echo "Testing production admin..."
          curl -f "https://admin.voidconfessions.app/login" || exit 1
          echo "✓ Production admin is accessible"

          echo "All production smoke tests passed!"

      - name: Check for errors in logs
        run: |
          echo "Checking for critical errors in recent logs..."
          # This would check recent pod logs for critical errors
          # kubectl logs -n void-confessions -l app=api-gateway --since=5m | grep -i "error\|critical" || true

  # Final deployment notification
  notify-production:
    name: Notify Production Deployment
    runs-on: ubuntu-latest
    needs: smoke-tests-production
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.smoke-tests-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Production URLs" >> $GITHUB_STEP_SUMMARY
          echo "- [App](https://voidconfessions.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [API](https://api.voidconfessions.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [Admin](https://admin.voidconfessions.app)" >> $GITHUB_STEP_SUMMARY

      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.smoke-tests-production.result }}
          text: |
            Production deployment ${{ needs.smoke-tests-production.result }}!
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            URL: https://voidconfessions.app
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Rollback job (manual trigger only)
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: ${{ failure() && needs.smoke-tests-production.result == 'failure' }}
    needs: smoke-tests-production
    environment:
      name: production
    steps:
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Rollback deployments
        run: |
          echo "Rolling back production deployments..."

          for deployment in api-gateway confession-service sentiment-service redaction-service web admin; do
            echo "Rolling back ${deployment}..."
            kubectl rollout undo deployment/${deployment} -n void-confessions
          done

      - name: Wait for rollback
        run: |
          for deployment in api-gateway confession-service sentiment-service redaction-service web admin; do
            kubectl rollout status deployment/${deployment} -n void-confessions --timeout=300s
          done

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          kubectl get pods -n void-confessions

          # Run quick health check
          curl -f "https://api.voidconfessions.app/health" || echo "Warning: Health check failed after rollback"

      - name: Notify rollback
        run: |
          echo "## Production Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Smoke tests failed" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
